<!doctype html>
<!--
  The GNOME command bar, mid-query. This is the example the README already walks
  through in prose ("100 km in mi"), so the strings here are the real ones: they
  were taken from `evaluate('100 km in mi')` in calc.js, which returns
  {title: '62.1371192237 mi', subtitle: '100 km'}, from historyProvider's
  subtitle template `Text · 11 B · 2m`, and from notepadProvider's append row.

  Sections follow PROVIDERS order in extension.js, and only the ones that match
  are drawn — with a query, a provider that finds nothing is hidden rather than
  printing "No matches". The notepad's append row is always last. Row one
  carries .is-selected because key focus never leaves the entry, so the
  extension draws the selection itself; the footer hints are what
  _syncFooterHints prints for it (an 'Enter' accel reads as Select, and a typed
  query makes Escape go Back).

  Nothing here is a capture. Everything below is invented, deliberately dull
  content: no tokens, no credentials, nothing that resembles a real secret.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Omelette — GNOME command bar</title>
        <link rel="stylesheet" href="mock.css" />
    </head>
    <body>
        <div class="mock gnome">
            <div class="panel">
                <div class="panel-side">
                    <span class="panel-item">Wed 15:42</span>
                </div>
                <div class="panel-side">
                    <span class="panel-item is-open">
                        <img class="app-icon" src="../assets/omelette.png" alt="" />
                    </span>
                </div>
            </div>

            <div class="popup-wrap">
                <div class="popup">
                    <div class="search">
                        <span class="search-text">100 km in mi</span>
                        <span class="caret"></span>
                    </div>

                    <div class="chip-row">
                        <span class="chip"><span class="i i-camera"></span>Area</span>
                        <span class="chip"><span class="i i-display"></span>Screen</span>
                        <span class="chip icon-only"><span class="i i-color"></span></span>
                        <span class="chip icon-only"><span class="i i-mic"></span></span>
                        <span class="chip icon-only"><span class="i i-note"></span></span>
                        <span class="spacer"></span>
                        <span class="chip"><span class="i i-pause"></span>Pause</span>
                        <span class="chip is-on"><span class="i i-sun"></span>Awake</span>
                    </div>

                    <div class="section">Answer</div>
                    <div class="row is-selected">
                        <div class="thumb"><span class="i i-calc"></span></div>
                        <div class="meta">
                            <div class="name answer">62.1371192237 mi</div>
                            <div class="hint">100 km</div>
                        </div>
                        <div class="accel">Enter</div>
                    </div>

                    <div class="section">Things you copied</div>
                    <div class="row">
                        <div class="thumb"><span class="i i-doc"></span></div>
                        <div class="meta">
                            <div class="name">100 km in mi</div>
                            <div class="hint">Text · 11 B · 2m</div>
                        </div>
                        <div class="row-actions">
                            <span class="row-btn"><span class="i i-star"></span></span>
                            <span class="row-btn"><span class="i i-snippet"></span></span>
                            <span class="row-btn"><span class="i i-trash"></span></span>
                        </div>
                    </div>

                    <div class="section">Notepad</div>
                    <div class="row">
                        <div class="thumb"><span class="i i-plus"></span></div>
                        <div class="meta">
                            <div class="name">Add “100 km in mi” to notepad</div>
                            <div class="hint">Jot it down and keep going</div>
                        </div>
                        <div class="accel">Add</div>
                    </div>

                    <div class="footer">
                        <span class="hint-pair"><span class="keycap">Enter</span>Select</span>
                        <span class="hint-pair"><span class="keycap">↑↓</span>Move</span>
                        <span class="hint-pair"><span class="keycap">Esc</span>Back</span>
                        <span class="spacer"></span>
                        <span class="chip icon-only"><span class="i i-more"></span></span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
