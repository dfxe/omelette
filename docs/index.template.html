<!doctype html>
<!--
  The source for docs/_site/index.html, which is generated and gitignored — edit
  this file, never the output. Everything between the <!== cb:… ==> markers
  below is substituted by docs/build.mjs from README.md, so the page has no
  prose of its own to fall out of date. See "The website" in the README.

  Colours and type follow dfxe.github.io, since this lives at a subpath of it.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Omelette — everything you copy, within reach</title>
        <meta
            name="description"
            content="A clipboard and screenshot history in your top bar, for macOS and GNOME. No accounts, no sync."
        />
        <meta property="og:title" content="Omelette" />
        <meta
            property="og:description"
            content="A clipboard and screenshot history in your top bar, for macOS and GNOME. No accounts, no sync."
        />
        <meta property="og:image" content="shots/gnome-command-bar.png" />
        <meta property="og:type" content="website" />
        <!-- The omelette mark on a filled tile — the same two colours as the
             editor's application icon, so a tab, the app and the top bar all
             read as one thing.
             The tile being *filled* is the load-bearing part. A browser tab is
             light in one theme and dark in the other, so the icon cannot borrow
             contrast from its background — an earlier outline-on-#2c2c2c
             version disappeared entirely on a dark tab. A saturated fill reads
             against both.
             The path is the 16px grid from
             linux/omelette@dfxe.github.io/icons/omelette-symbolic.svg, scaled
             and centred by the transform rather than redrawn, so the two cannot
             drift. The fold is an evenodd hole, which lets the blue show
             through instead of needing a third colour.
             Every # must be %23 or it terminates the URL as a fragment and the
             icon silently fails to load. -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a86cf'/%3E%3Cg transform='translate(2.78 3.52) scale(1.65)'%3E%3Cpath fill='%23f6d32d' fill-rule='evenodd' d='M8 2.2C12 2.2 15.2 5.5 15.2 9.6C15.2 10.5 14.95 11.2 14.5 11.75C14.05 12.3 13.25 12.5 12.6 12.2C11.6 12.95 10.53 12.95 9.53 12.2C8.53 12.95 7.47 12.95 6.47 12.2C5.47 12.95 4.4 12.95 3.4 12.2C2.75 12.5 1.95 12.3 1.5 11.75C1.05 11.2 0.8 10.5 0.8 9.6C0.8 5.5 4 2.2 8 2.2ZM4.35 10.7C5.3 7.15 8.05 4.5 11.75 3.85C9.15 5.75 7.2 8.4 6.2 11.45C5.6 10.95 4.95 10.7 4.35 10.7Z'/%3E%3C/g%3E%3C/svg%3E"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            :root {
                --fg: #f0f0ea;
                --muted: #a8aaa1;
                --dim: #74766e;
                --line: rgba(240, 240, 234, 0.22);
                --hair: rgba(240, 240, 234, 0.12);
                /* Matches the body background. The brand mark's front board
                   fills with this to hide the sheet behind it. */
                --mark-bg: #222;
                --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            }

            html {
                -webkit-text-size-adjust: 100%;
            }

            body {
                margin: 0;
                background: #222;
                color: var(--fg);
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                font-size: 16px;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }

            a {
                color: inherit;
            }

            a:focus-visible {
                outline: 2px solid var(--fg);
                outline-offset: 3px;
            }

            .shell {
                max-width: 940px;
                margin: 0 auto;
                padding: clamp(18px, 3vw, 34px) clamp(18px, 4vw, 40px)
                    clamp(40px, 6vw, 80px);
            }

            /* The mono uppercase micro-label, used for the topbar, every section
               heading and the footer. */
            .micro {
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.76rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .topbar {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px 20px;
                padding-bottom: 14px;
                border-bottom: 1px solid var(--line);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                color: var(--fg);
                letter-spacing: 0.18em;
                text-decoration: none;
            }

            .brand svg {
                display: block;
                width: 20px;
                height: 20px;
                /* The topbar is baseline-aligned for its text; the mark is not
                   text, so it needs nudging onto the same optical line. */
                margin-bottom: -1px;
            }

            .topbar nav {
                display: flex;
                gap: 18px;
            }

            .topbar nav a:hover {
                color: var(--fg);
            }

            /* ── Lede ─────────────────────────────────────────────────── */

            .lede {
                padding: clamp(36px, 7vw, 76px) 0 clamp(28px, 5vw, 48px);
            }

            /* The tagline arrives as one <p> whose leading <strong> is the
               headline half of the sentence — hence the size here and the block
               treatment of the strong. */
            .lede .tagline {
                max-width: 30ch;
                margin: 0;
                font-size: clamp(1.9rem, 5.4vw, 3.1rem);
                font-weight: 500;
                letter-spacing: -0.02em;
                line-height: 1.12;
            }

            .lede .tagline strong {
                display: block;
                font-weight: 500;
            }

            .lede .body {
                max-width: 62ch;
                margin-top: clamp(20px, 3vw, 30px);
                color: var(--muted);
            }

            .lede .body p {
                margin: 0 0 0.9em;
            }

            .lede .body p:last-child {
                margin-bottom: 0;
            }

            /* ── Sections ─────────────────────────────────────────────── */

            section {
                padding-top: clamp(34px, 5vw, 58px);
            }

            h2 {
                margin: 0 0 22px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--line);
                font-size: 0.76rem;
                font-weight: 400;
            }

            /* ── Screenshots ──────────────────────────────────────────── */

            .shots {
                display: grid;
                gap: clamp(16px, 2.4vw, 26px);
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            /* The command bar is the thing worth showing first, so it gets the
               full width and the other two share the row beneath. */
            .shot--wide {
                grid-column: 1 / -1;
            }

            figure {
                margin: 0;
            }

            /* Each shot links to its own PNG: at two per row they are legible
               enough to judge the UI by, but not to read every row of. */
            figure a {
                display: block;
            }

            figure img {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid var(--hair);
                border-radius: 8px;
            }

            figure a:hover img {
                border-color: var(--line);
            }

            figcaption {
                margin-top: 10px;
                color: var(--dim);
                font-family: var(--mono);
                /* 12px exactly. No text on this page goes below that — the
                   build measures it (see checkFontFloor in build.mjs). */
                font-size: 0.75rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            /* Said once, plainly: these are drawn, not captured. */
            .disclaimer {
                margin: 20px 0 0;
                color: var(--dim);
                font-size: 0.86rem;
            }

            /* ── Tables and code, as emitted by build.mjs ─────────────── */

            .scroll-x {
                overflow-x: auto;
                /* Room for the scrollbar so it never sits on the last row. */
                padding-bottom: 4px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.94rem;
            }

            th,
            td {
                padding: 9px 14px 9px 0;
                border-bottom: 1px solid var(--hair);
                text-align: left;
                white-space: nowrap;
            }

            th {
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.75rem;
                font-weight: 400;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            th:not(:first-child),
            td.yes,
            td.no {
                width: 5.5rem;
                padding-right: 0;
                text-align: center;
            }

            /* ✅ brings its own colour — it is an emoji, and `color` would do
               nothing to it. Only the em dash needs dimming, so that a row's
               meaning is legible from the shape of the column. */
            td.no {
                color: var(--dim);
            }

            pre {
                margin: 0 0 18px;
                padding: 14px 16px;
                overflow-x: auto;
                border: 1px solid var(--hair);
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.24);
                font-size: 0.84rem;
                line-height: 1.5;
            }

            pre,
            code {
                font-family: var(--mono);
            }

            p code {
                padding: 1px 5px;
                border-radius: 4px;
                background: rgba(240, 240, 234, 0.09);
                font-size: 0.86em;
            }

            section p {
                max-width: 68ch;
                margin: 0 0 16px;
                color: var(--muted);
            }

            section p strong {
                color: var(--fg);
                font-weight: 500;
            }

            /* ── Footer ───────────────────────────────────────────────── */

            footer {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px 20px;
                margin-top: clamp(44px, 7vw, 84px);
                padding-top: 14px;
                border-top: 1px solid var(--line);
            }

            footer nav {
                display: flex;
                gap: 18px;
            }

            footer a:hover {
                color: var(--fg);
            }

            @media (max-width: 720px) {
                .shots {
                    grid-template-columns: minmax(0, 1fr);
                }

                .lede .tagline {
                    max-width: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header class="topbar micro">
                <a class="brand" href="./">
                    <!-- A folded omelette. The source of truth for this shape is
                         linux/omelette@dfxe.github.io/icons/omelette-symbolic.svg
                         — the path below is that file's 16px grid, positioned by
                         the transform rather than redrawn, so editing the mark
                         means editing it in both places and nowhere else.
                         The fold is an evenodd hole rather than a second shape,
                         so the page background shows through and the mark stays
                         one colour. That also retires the --mark-bg knockout the
                         old clipboard needed: nothing here overlaps. -->
                    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                        <g transform="translate(2.78 3.52) scale(1.65)">
                            <path
                                fill="#f6d32d"
                                fill-rule="evenodd"
                                d="M8 2.2C12 2.2 15.2 5.5 15.2 9.6C15.2 10.5 14.95 11.2 14.5 11.75C14.05 12.3 13.25 12.5 12.6 12.2C11.6 12.95 10.53 12.95 9.53 12.2C8.53 12.95 7.47 12.95 6.47 12.2C5.47 12.95 4.4 12.95 3.4 12.2C2.75 12.5 1.95 12.3 1.5 11.75C1.05 11.2 0.8 10.5 0.8 9.6C0.8 5.5 4 2.2 8 2.2ZM4.35 10.7C5.3 7.15 8.05 4.5 11.75 3.85C9.15 5.75 7.2 8.4 6.2 11.45C5.6 10.95 4.95 10.7 4.35 10.7Z"
                            />
                        </g>
                    </svg>
                    Omelette
                </a>
                <nav>
                    <span>macOS 13+ · GNOME 45–49</span>
                    <a href="https://github.com/dfxe/cboite">GitHub</a>
                </nav>
            </header>

            <div class="lede">
                <div class="tagline"><!-- cb:tagline --></div>
                <div class="body"><!-- cb:lede --></div>
            </div>

            <section>
                <h2 class="micro">Screenshots</h2>
                <div class="shots">
                    <figure class="shot--wide">
                        <a href="shots/gnome-command-bar.png">
                            <img
                                src="shots/gnome-command-bar.png"
                                alt="The GNOME popup with '100 km in mi' typed into the command bar, showing an Answer row reading 62.1371192237 mi above a matching clipboard history entry."
                            />
                        </a>
                        <figcaption>GNOME · the command bar</figcaption>
                    </figure>
                    <figure>
                        <a href="shots/gnome-history.png">
                            <img
                                src="shots/gnome-history.png"
                                alt="The GNOME popup at rest, listing a pinned colour swatch, a git command, a screenshot thumbnail and a URL, with a Screenshots section beneath."
                            />
                        </a>
                        <figcaption>GNOME · history and screenshots</figcaption>
                    </figure>
                    <figure>
                        <a href="shots/macos-popover.png">
                            <img
                                src="shots/macos-popover.png"
                                alt="The macOS menu-bar popover titled Everything you copied, listing seven copied items above a footer with Pause, Area, Screen and Quit."
                            />
                        </a>
                        <figcaption>macOS · the menu-bar popover</figcaption>
                    </figure>
                </div>
                <p class="disclaimer">
                    Rendered mockups with sample data, not live captures — a clipboard vault is
                    hard to photograph without photographing its owner. The layout, strings and
                    formatting come from the source.
                </p>
            </section>

            <section>
                <h2 class="micro">At a glance</h2>
                <!-- cb:glance -->
            </section>

            <section>
                <h2 class="micro">How to install</h2>
                <!-- cb:install -->
            </section>

            <footer class="micro">
                <span>MIT</span>
                <nav>
                    <a href="https://github.com/dfxe/cboite">Source</a>
                    <a href="https://github.com/dfxe/cboite#readme">Docs</a>
                    <a href="https://dfxe.github.io/">dfxe</a>
                </nav>
            </footer>
        </div>
    </body>
</html>
