<!doctype html>
<!--
  The source for docs/_site/index.html, which is generated and gitignored — edit
  this file, never the output. Everything between the <!== cb:… ==> markers
  below is substituted by docs/build.mjs from README.md, so the page has no
  prose of its own to fall out of date. See "The website" in the README.

  Colours and type follow dfxe.github.io, since this lives at a subpath of it.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Omelette — Early beta for coding agent workflows</title>
        <meta
            name="description"
            content="Early beta built mainly for coding agent workflows. Clipboard and screenshot history in your top bar, for macOS and GNOME. No accounts, no sync."
        />
        <meta property="og:title" content="Omelette — Early beta for coding agent workflows" />
        <meta
            property="og:description"
            content="Early beta built mainly for coding agent workflows. Clipboard and screenshot history in your top bar, for macOS and GNOME. No accounts, no sync."
        />
        <meta property="og:image" content="shots/gnome-command-bar.png" />
        <meta property="og:type" content="website" />
        <!-- The shipped Omelette app icon is used unchanged for the browser tab and site header. -->
        <link
            rel="icon"
            href="assets/omelette.png" type="image/png"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            :root {
                --fg: #f0f0ea;
                --muted: #a8aaa1;
                --dim: #74766e;
                --line: rgba(240, 240, 234, 0.22);
                --hair: rgba(240, 240, 234, 0.12);
                --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            }

            html {
                -webkit-text-size-adjust: 100%;
            }

            body {
                margin: 0;
                background: #18191b;
                background-image:
                    radial-gradient(ellipse at 85% 15%, rgba(245, 158, 11, 0.05) 0%, transparent 45%),
                    radial-gradient(ellipse at 15% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
                color: var(--fg);
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                font-size: 16px;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }

            a {
                color: inherit;
                transition: color 0.15s ease;
            }

            a:focus-visible {
                outline: 2px solid var(--fg);
                outline-offset: 3px;
            }

            .shell {
                max-width: 940px;
                margin: 0 auto;
                padding: clamp(18px, 3vw, 34px) clamp(18px, 4vw, 40px)
                    clamp(40px, 6vw, 80px);
            }

            /* The mono uppercase micro-label, used for the topbar, every section
               heading and the footer. */
            .micro {
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.76rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .topbar {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px 20px;
                padding-bottom: 14px;
                border-bottom: 1px solid var(--line);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                color: var(--fg);
                letter-spacing: 0.18em;
                text-decoration: none;
            }

            .brand img {
                display: block;
                width: 20px;
                height: 20px;
                /* The topbar is baseline-aligned for its text; the mark is not
                   text, so it needs nudging onto the same optical line. */
                margin-bottom: -1px;
            }

            .topbar nav {
                display: flex;
                gap: 18px;
            }

            .topbar nav a:hover {
                color: var(--fg);
            }

            /* ── Lede ─────────────────────────────────────────────────── */

            .lede {
                padding: clamp(36px, 7vw, 76px) 0 clamp(28px, 5vw, 48px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: clamp(24px, 5vw, 48px);
            }

            .lede-content {
                flex: 1 1 520px;
                min-width: 0;
            }

            .beta-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 16px;
                padding: 3px 10px;
                border: 1px solid var(--line);
                border-radius: 9999px;
                background: rgba(255, 255, 255, 0.03);
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.75rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .beta-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #f59e0b;
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
            }

            /* The tagline arrives as one <p> whose leading <strong> is the
               headline half of the sentence — hence the size here and the block
               treatment of the strong. */
            .lede .tagline {
                max-width: 30ch;
                margin: 0;
                font-size: clamp(1.95rem, 5.4vw, 3.15rem);
                font-weight: 500;
                letter-spacing: -0.025em;
                line-height: 1.12;
            }

            .lede .tagline strong {
                display: block;
                font-weight: 500;
                background: linear-gradient(180deg, #ffffff 0%, #dedecc 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .lede .body {
                max-width: 62ch;
                margin-top: clamp(20px, 3vw, 30px);
                color: var(--muted);
            }

            .lede .body p {
                margin: 0 0 0.9em;
            }

            .lede .body p:last-child {
                margin-bottom: 0;
            }

            /* ── 3D Hero Widget ───────────────────────────────────────── */

            .hero-3d-wrap {
                flex: 0 0 clamp(230px, 30vw, 330px);
                display: flex;
                flex-direction: column;
                align-items: center;
                user-select: none;
                position: relative;
            }

            .hero-3d-wrap::before {
                content: "";
                position: absolute;
                inset: -20%;
                background: radial-gradient(circle at center, rgba(245, 158, 11, 0.09) 0%, transparent 68%);
                pointer-events: none;
                z-index: 0;
            }

            .hero-3d-container {
                position: relative;
                width: 100%;
                aspect-ratio: 1 / 1;
                border-radius: 28px;
                cursor: grab;
                touch-action: none;
                z-index: 1;
            }

            .hero-3d-container:active {
                cursor: grabbing;
            }

            .hero-3d-fallback {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .hero-3d-canvas-box {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .hero-3d-canvas-box canvas {
                display: block;
                width: 100% !important;
                height: 100% !important;
                border-radius: 28px;
            }

            /* ── Sections ─────────────────────────────────────────────── */

            section {
                padding-top: clamp(34px, 5vw, 58px);
            }

            h2 {
                margin: 0 0 22px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--line);
                font-size: 0.76rem;
                font-weight: 400;
            }

            /* ── Screenshots ──────────────────────────────────────────── */

            .shots {
                display: grid;
                gap: clamp(16px, 2.4vw, 26px);
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            /* The command bar is the thing worth showing first, so it gets the
               full width and the other two share the row beneath. */
            .shot--wide {
                grid-column: 1 / -1;
            }

            figure {
                margin: 0;
            }

            /* Each shot links to its own PNG: at two per row they are legible
               enough to judge the UI by, but not to read every row of. */
            figure a {
                display: block;
                border-radius: 12px;
                overflow: hidden;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            figure img {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid var(--hair);
                border-radius: 12px;
                box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.45);
                transition: border-color 0.2s ease, transform 0.2s ease;
            }

            figure a:hover img {
                border-color: rgba(240, 240, 234, 0.35);
                transform: translateY(-2px);
            }

            figcaption {
                margin-top: 10px;
                color: var(--dim);
                font-family: var(--mono);
                /* 12px exactly. No text on this page goes below that — the
                   build measures it (see checkFontFloor in build.mjs). */
                font-size: 0.75rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            /* Said once, plainly: these are drawn, not captured. */
            .disclaimer {
                margin: 20px 0 0;
                color: var(--dim);
                font-size: 0.86rem;
            }

            /* ── Tables and code, as emitted by build.mjs ─────────────── */

            .scroll-x {
                overflow-x: auto;
                /* Room for the scrollbar so it never sits on the last row. */
                padding-bottom: 4px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.94rem;
            }

            th,
            td {
                padding: 9px 14px 9px 0;
                border-bottom: 1px solid var(--hair);
                text-align: left;
                white-space: nowrap;
            }

            th {
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.75rem;
                font-weight: 400;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            th:not(:first-child),
            td.yes,
            td.no {
                width: 5.5rem;
                padding-right: 0;
                text-align: center;
            }

            /* ✅ brings its own colour — it is an emoji, and `color` would do
               nothing to it. Only the em dash needs dimming, so that a row's
               meaning is legible from the shape of the column. */
            td.no {
                color: var(--dim);
            }

            pre {
                margin: 0 0 18px;
                padding: 14px 16px;
                overflow-x: auto;
                border: 1px solid var(--hair);
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.24);
                font-size: 0.84rem;
                line-height: 1.5;
            }

            pre,
            code {
                font-family: var(--mono);
            }

            p code {
                padding: 1px 5px;
                border-radius: 4px;
                background: rgba(240, 240, 234, 0.09);
                font-size: 0.86em;
            }

            section p {
                max-width: 68ch;
                margin: 0 0 16px;
                color: var(--muted);
            }

            section p strong {
                color: var(--fg);
                font-weight: 500;
            }

            /* ── Footer ───────────────────────────────────────────────── */

            footer {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px 20px;
                margin-top: clamp(44px, 7vw, 84px);
                padding-top: 14px;
                border-top: 1px solid var(--line);
            }

            footer nav {
                display: flex;
                gap: 18px;
            }

            footer a:hover {
                color: var(--fg);
            }

            @media (max-width: 720px) {
                .shots {
                    grid-template-columns: minmax(0, 1fr);
                }

                .lede {
                    flex-direction: column-reverse;
                    align-items: center;
                    text-align: center;
                    gap: 28px;
                }

                .lede .tagline {
                    max-width: none;
                }

                .hero-3d-wrap {
                    max-width: 260px;
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header class="topbar micro">
                <a class="brand" href="./">
                    <img src="assets/omelette.png" alt="" />
                    Omelette · Early beta
                </a>
                <nav>
                    <span>macOS 13+ · GNOME 45–49</span>
                    <a href="https://github.com/dfxe/omelette">GitHub</a>
                </nav>
            </header>

            <div class="lede">
                <div class="lede-content">
                    <div class="beta-badge">
                        <span class="beta-dot"></span>
                        <span>Early Beta · v0.1</span>
                    </div>
                    <div class="tagline"><!-- cb:tagline --></div>
                    <div class="body"><!-- cb:supporting --></div>
                </div>
                <div class="hero-3d-wrap">
                    <div class="hero-3d-container">
                        <img
                            id="hero-fallback-img"
                            class="hero-3d-fallback"
                            src="assets/omelette.png"
                            alt="Omelette in cast iron skillet"
                            width="320"
                            height="320"
                        />
                        <div id="hero-3d-canvas" class="hero-3d-canvas-box"></div>
                    </div>
                </div>
            </div>

            <section>
                <h2 class="micro">Screenshots</h2>
                <div class="shots">
                    <figure class="shot--wide">
                        <a href="shots/gnome-command-bar.png">
                            <img
                                src="shots/gnome-command-bar.png"
                                alt="The GNOME popup with '100 km in mi' typed into the command bar, showing an Answer row reading 62.1371192237 mi above a matching clipboard history entry."
                            />
                        </a>
                        <figcaption>GNOME · the command bar</figcaption>
                    </figure>
                    <figure>
                        <a href="shots/gnome-history.png">
                            <img
                                src="shots/gnome-history.png"
                                alt="The GNOME popup at rest, listing a pinned colour swatch, a git command, a screenshot thumbnail and a URL, with a Screenshots section beneath."
                            />
                        </a>
                        <figcaption>GNOME · history and screenshots</figcaption>
                    </figure>
                    <figure>
                        <a href="shots/macos-popover.png">
                            <img
                                src="shots/macos-popover.png"
                                alt="The macOS menu-bar popover titled Everything you copied, listing seven copied items above a footer with Pause, Area, Screen and Quit."
                            />
                        </a>
                        <figcaption>macOS · the menu-bar popover</figcaption>
                    </figure>
                </div>
                <p class="disclaimer">
                    Rendered mockups with sample data.
                </p>
            </section>


            <footer class="micro">
                <span>MIT</span>
                <nav>
                    <a href="https://github.com/dfxe/omelette">Source</a>
                    <a href="https://github.com/dfxe/omelette#readme">Docs</a>
                    <a href="https://dfxe.github.io/">dfxe</a>
                </nav>
            </footer>
        </div>
        <script type="module" src="assets/omelette-3d.js"></script>
    </body>
</html>
