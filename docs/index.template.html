<!doctype html>
<!--
  The source for docs/_site/index.html, which is generated and gitignored — edit
  this file, never the output. Everything between the <!== cb:… ==> markers
  below is substituted by docs/build.mjs from README.md, so the page has no
  prose of its own to fall out of date. See "The website" in the README.

  The palette is the GNOME extension's "Yolk" theme: warm charcoal, cream text
  and a yolk accent, so the page and the popup read as the same product.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Omelette — Early beta for coding agent workflows</title>
        <meta
            name="description"
            content="Early beta built mainly for coding agent workflows. Clipboard and screenshot history in your GNOME top bar. No accounts, no sync."
        />
        <meta property="og:title" content="Omelette — Early beta for coding agent workflows" />
        <meta
            property="og:description"
            content="Early beta built mainly for coding agent workflows. Clipboard and screenshot history in your GNOME top bar. No accounts, no sync."
        />
        <meta property="og:image" content="shots/gnome-command-bar.png" />
        <meta property="og:type" content="website" />
        <meta name="theme-color" content="#1b1511" />
        <!-- The shipped Omelette app icon is used unchanged for the browser tab and site header. -->
        <link rel="icon" href="assets/omelette.png" type="image/png" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            :root {
                --bg: #1b1511;
                --bg-raised: #241c16;
                --fg: #f7efdf;
                --muted: #c2b5a0;
                --dim: #8f8270;
                --line: rgba(247, 239, 223, 0.16);
                --hair: rgba(247, 239, 223, 0.09);
                --yolk: #f2b84b;
                --yolk-deep: #e0962a;
                --chive: #7fb069;
                --radius: 18px;
                --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
                    monospace;
                --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
            }

            html {
                -webkit-text-size-adjust: 100%;
                scroll-behavior: smooth;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--fg);
                font-family: var(--sans);
                font-size: 16px;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
                overflow-x: hidden;
            }

            /* Warm light pooling behind the hero, plus a faint dot grid that
               fades out before the screenshots so it never competes with them. */
            body::before {
                content: "";
                position: absolute;
                inset: 0 0 auto 0;
                height: 1100px;
                z-index: -1;
                pointer-events: none;
                background:
                    radial-gradient(
                        620px 460px at 76% 300px,
                        rgba(242, 184, 75, 0.2),
                        transparent 70%
                    ),
                    radial-gradient(
                        520px 380px at 12% 120px,
                        rgba(127, 176, 105, 0.08),
                        transparent 70%
                    ),
                    radial-gradient(rgba(247, 239, 223, 0.07) 1px, transparent 1.4px) 0 0 / 22px
                        22px;
                -webkit-mask-image: linear-gradient(#000 55%, transparent);
                mask-image: linear-gradient(#000 55%, transparent);
            }

            a {
                color: inherit;
            }

            a:focus-visible {
                outline: 2px solid var(--yolk);
                outline-offset: 3px;
                border-radius: 6px;
            }

            ::selection {
                background: rgba(242, 184, 75, 0.35);
                color: var(--fg);
            }

            .shell {
                max-width: 1120px;
                margin: 0 auto;
                padding: 0 clamp(18px, 4vw, 40px);
            }

            .micro {
                font-family: var(--mono);
                font-size: 0.75rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            /* ── Topbar ───────────────────────────────────────────────── */

            .topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                background: rgba(27, 21, 17, 0.72);
                -webkit-backdrop-filter: saturate(140%) blur(14px);
                backdrop-filter: saturate(140%) blur(14px);
                border-bottom: 1px solid var(--hair);
            }

            .topbar .shell {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                height: 60px;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 650;
                font-size: 1.02rem;
                letter-spacing: -0.01em;
                text-decoration: none;
            }

            .brand img {
                display: block;
                width: 28px;
                height: 28px;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 3px 9px;
                border: 1px solid rgba(242, 184, 75, 0.4);
                border-radius: 999px;
                background: rgba(242, 184, 75, 0.1);
                color: var(--yolk);
                font-family: var(--mono);
                font-size: 0.75rem;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .badge::before {
                content: "";
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
                box-shadow: 0 0 8px currentColor;
            }

            .topbar nav {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .topbar nav a {
                padding: 7px 12px;
                border-radius: 999px;
                color: var(--muted);
                font-size: 0.9rem;
                text-decoration: none;
                transition: color 0.15s, background 0.15s;
            }

            .topbar nav a:hover {
                color: var(--fg);
                background: rgba(247, 239, 223, 0.07);
            }

            .topbar nav a.gh {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                color: var(--fg);
                border: 1px solid var(--line);
            }

            .gh svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            /* ── Hero ─────────────────────────────────────────────────── */

            .hero {
                display: grid;
                grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
                align-items: center;
                gap: clamp(24px, 4vw, 56px);
                padding: clamp(48px, 9vw, 112px) 0 clamp(48px, 8vw, 96px);
            }

            .hero-copy {
                min-width: 0;
            }

            .hero-copy .badge {
                margin-bottom: 26px;
            }

            /* The tagline arrives as one <p> whose leading <strong> is the
               headline; everything after it is the smaller second line. */
            .tagline p {
                margin: 0;
            }

            .tagline strong {
                display: block;
                font-size: clamp(2.6rem, 6.4vw, 4.6rem);
                font-weight: 700;
                letter-spacing: -0.035em;
                line-height: 1.02;
                background: linear-gradient(
                    180deg,
                    var(--fg) 0%,
                    var(--fg) 45%,
                    #f3d79a 100%
                );
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-wrap: balance;
            }

            .supporting {
                max-width: 46ch;
                margin-top: clamp(20px, 2.6vw, 28px);
                color: var(--muted);
                font-size: clamp(1.05rem, 1.6vw, 1.22rem);
                line-height: 1.55;
            }

            .supporting p {
                margin: 0;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin-top: clamp(28px, 3.6vw, 40px);
            }

            .button {
                display: inline-flex;
                align-items: center;
                gap: 9px;
                padding: 12px 20px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 0.98rem;
                text-decoration: none;
                transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
            }

            .button svg {
                width: 18px;
                height: 18px;
                fill: currentColor;
            }

            .button.primary {
                background: linear-gradient(180deg, #f7c662, var(--yolk-deep));
                color: #2a1c0b;
                box-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.35) inset,
                    0 10px 30px -10px rgba(242, 184, 75, 0.7);
            }

            .button.primary:hover {
                transform: translateY(-1px);
                box-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.35) inset,
                    0 14px 36px -10px rgba(242, 184, 75, 0.85);
            }

            .button.ghost {
                border: 1px solid var(--line);
                color: var(--fg);
                background: rgba(247, 239, 223, 0.03);
            }

            .button.ghost:hover {
                background: rgba(247, 239, 223, 0.08);
            }

            .platforms {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 18px;
                margin: 28px 0 0;
                padding: 0;
                list-style: none;
                color: var(--dim);
            }

            .platforms li {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .platforms li::before {
                content: "";
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--chive);
            }

            /* ── 3D omelette ──────────────────────────────────────────── */

            .hero-3d-wrap {
                position: relative;
                justify-self: center;
                width: min(100%, 460px);
                user-select: none;
            }

            /* A soft yolk halo and a floor shadow, so the floating tile has
               something to hover over. */
            .hero-3d-wrap::before {
                content: "";
                position: absolute;
                inset: 6%;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(242, 184, 75, 0.32),
                    rgba(242, 184, 75, 0.08) 45%,
                    transparent 70%
                );
                filter: blur(24px);
                pointer-events: none;
            }

            .hero-3d-wrap::after {
                content: "";
                position: absolute;
                left: 22%;
                right: 22%;
                bottom: -2%;
                height: 7%;
                border-radius: 50%;
                background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent);
                filter: blur(6px);
                pointer-events: none;
            }

            .hero-3d-container {
                position: relative;
                z-index: 1;
                width: 100%;
                aspect-ratio: 1 / 1;
                cursor: grab;
                touch-action: none;
            }

            .hero-3d-container:active {
                cursor: grabbing;
            }

            .hero-3d-fallback {
                position: absolute;
                inset: 14%;
                width: 72%;
                height: 72%;
                object-fit: contain;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .hero-3d-canvas-box {
                position: absolute;
                inset: 0;
            }

            .hero-3d-canvas-box canvas {
                display: block;
                width: 100% !important;
                height: 100% !important;
            }

            /* ── Sections ─────────────────────────────────────────────── */

            section {
                padding: clamp(24px, 4vw, 40px) 0 0;
                scroll-margin-top: 80px;
            }

            .section-head {
                display: flex;
                align-items: center;
                gap: 14px;
                margin: 0 0 clamp(20px, 3vw, 32px);
                color: var(--muted);
                font-weight: 400;
            }

            .section-head::after {
                content: "";
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, var(--line), transparent);
            }

            .section-head .num {
                color: var(--yolk);
            }

            /* ── Screenshots ──────────────────────────────────────────── */

            .shots {
                display: grid;
                gap: clamp(16px, 2.4vw, 28px);
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            figure {
                margin: 0;
                display: flex;
                flex-direction: column;
            }

            /* Each shot sits on its own lit "desk" panel. On hover the panel
               tilts toward the pointer and the shot lifts off it; --rx, --ry,
               --gx and --gy are set by the script at the end of the page.
               No overflow: hidden here, because it would flatten the 3D. */
            .frame {
                --rx: 0deg;
                --ry: 0deg;
                --lift: 0px;
                --glare: 0;
                position: relative;
                display: flex;
                flex: 1;
                align-items: center;
                justify-content: center;
                padding: clamp(14px, 3vw, 40px);
                border: 1px solid var(--hair);
                border-radius: var(--radius);
                background:
                    radial-gradient(
                        120% 80% at 50% 0%,
                        rgba(242, 184, 75, 0.12),
                        transparent 60%
                    ),
                    linear-gradient(180deg, #2a211a, #1f1813);
                transform: perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));
                transform-style: preserve-3d;
                transition:
                    border-color 0.2s,
                    transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 0.5s;
            }

            .frame:hover {
                --lift: 46px;
                --glare: 1;
                border-color: rgba(242, 184, 75, 0.35);
                box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.8);
            }

            /* While the pointer is moving the tilt tracks it directly; the
               long transition is only for settling back when it leaves. */
            .frame.is-tracking {
                transition:
                    border-color 0.2s,
                    transform 0.08s linear,
                    box-shadow 0.5s;
            }

            /* A soft highlight that follows the pointer across the panel. */
            .frame::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: radial-gradient(
                    420px circle at var(--gx, 50%) var(--gy, 0%),
                    rgba(255, 236, 200, 0.13),
                    transparent 60%
                );
                opacity: var(--glare);
                transition: opacity 0.3s;
                pointer-events: none;
            }

            .frame img {
                display: block;
                max-width: 100%;
                height: auto;
                border-radius: 10px;
                transform: translateZ(var(--lift));
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.35),
                    0 24px 60px -18px rgba(0, 0, 0, 0.75);
                transition:
                    transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 0.5s;
            }

            .frame:hover img {
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.35),
                    0 50px 90px -24px rgba(0, 0, 0, 0.85);
            }

            figcaption {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 12px;
                color: var(--dim);
            }

            .disclaimer {
                margin: 22px 0 0;
                color: var(--dim);
                font-size: 0.86rem;
            }

            /* ── Footer ───────────────────────────────────────────────── */

            footer {
                margin-top: clamp(40px, 6vw, 80px);
            }

            /* The dotted omelette (assets/omelette-dots.js) stands on the
               footer's rule like something on a horizon. */
            .footer-art {
                display: block;
                width: 100%;
                height: clamp(300px, 34vw, 380px);
            }

            .footer-bar {
                border-top: 1px solid var(--hair);
            }

            .footer-bar .shell {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 12px 24px;
                padding-block: 26px 40px;
                color: var(--dim);
            }

            footer .brand {
                color: var(--muted);
                font-size: 0.95rem;
            }

            footer .brand img {
                width: 22px;
                height: 22px;
            }

            footer nav {
                display: flex;
                gap: 20px;
            }

            footer a {
                text-decoration: none;
            }

            footer nav a:hover {
                color: var(--yolk);
            }

            @media (max-width: 860px) {
                .hero {
                    grid-template-columns: minmax(0, 1fr);
                    text-align: center;
                    padding-top: 28px;
                }

                .hero-3d-wrap {
                    order: -1;
                    width: min(78vw, 340px);
                }

                .supporting {
                    margin-inline: auto;
                }

                .actions,
                .platforms {
                    justify-content: center;
                }

                .shots {
                    grid-template-columns: minmax(0, 1fr);
                }
            }

            @media (max-width: 520px) {
                .topbar nav a:not(.gh) {
                    display: none;
                }

                .actions .button {
                    flex: 1 1 100%;
                    justify-content: center;
                }

                .footer-bar .shell {
                    flex-direction: column;
                    text-align: center;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }

                .button,
                .frame,
                .frame img {
                    transition: none;
                }

                .frame,
                .frame:hover {
                    --lift: 0px;
                    transform: none;
                }
            }
        </style>
    </head>
    <body>

        <script type="module" src="assets/omelette-dots.js"></script>
        <script>
            // Tilt each screenshot panel toward the pointer. Mouse and pen only:
            // on touch the tilt would fight scrolling.
            if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
                const MAX_TILT = 9;
                for (const frame of document.querySelectorAll(".frame")) {
                    frame.addEventListener("pointermove", event => {
                        if (event.pointerType === "touch") return;
                        const box = frame.getBoundingClientRect();
                        const x = (event.clientX - box.left) / box.width;
                        const y = (event.clientY - box.top) / box.height;
                        frame.classList.add("is-tracking");
                        frame.style.setProperty("--ry", `${(x - 0.5) * 2 * MAX_TILT}deg`);
                        frame.style.setProperty("--rx", `${(0.5 - y) * 2 * MAX_TILT}deg`);
                        frame.style.setProperty("--gx", `${x * 100}%`);
                        frame.style.setProperty("--gy", `${y * 100}%`);
                    });
                    frame.addEventListener("pointerleave", () => {
                        frame.classList.remove("is-tracking");
                        frame.style.setProperty("--rx", "0deg");
                        frame.style.setProperty("--ry", "0deg");
                    });
                }
            }
        </script>
