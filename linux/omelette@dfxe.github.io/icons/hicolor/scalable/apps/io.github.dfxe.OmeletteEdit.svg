<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    The editor's application icon.

    Deliberately the same path as icons/omelette-symbolic.svg, reused through a
    transform rather than redrawn at 128px, so the panel mark and the app icon
    cannot drift apart. Editing the shape means editing it in both files — the
    coordinates below are on the 16px grid and scaled up here.

    A warm charcoal plate, amber silhouette and coral fold form three flat tones
    that stay clear in the app grid and at 32px in an alt-tab switcher.

    The nested hicolor/scalable/apps/ path is not decoration: Gtk.IconTheme's
    add_search_path() expects a directory laid out as a theme, and the file must
    be named after the application id for set_icon_name(APP_ID) to find it.

    The comment sits inside <svg> because gdk-pixbuf sniffs for the literal
    "<svg" in the first ~100 bytes and a header comment above the root element
    stops the file loading at all.
  -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="#2b2522"/>
  <!-- The 16px shape is enlarged six times and centred optically. -->
  <g transform="translate(16, 13) scale(6)">
    <path fill="#f2b84b" d="
      M8 1.75 C12.05 1.75 15.25 4.95 15.25 9
      C15.25 11.95 12.95 14.25 10 14.25 L6 14.25
      C3.05 14.25 0.75 11.95 0.75 9 C0.75 4.95 3.95 1.75 8 1.75 Z
    "/>
    <path fill="#e86a3d" d="
      M4.15 11.75 C5.35 7.9 8.15 5.05 12.15 4.05
      C9.35 6.05 7.55 8.65 6.7 11.75 Z
    "/>
  </g>
</svg>
