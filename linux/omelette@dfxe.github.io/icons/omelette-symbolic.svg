<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    The panel icon: a calm folded omelette silhouette on the 16px symbolic grid.
    Its broad outer curve and diagonal fold survive at panel size.

    Filled rather than stroked: a stroked outline at 16px lands hairlines on
    half-pixels and greys out. The fold is a generous hole in the same path, so
    the mark remains a single recolourable shape without tiny decorative detail.

    Two things here are load-bearing rather than stylistic:
      - The `-symbolic` suffix in the filename is how St and GTK decide to
        recolour this to the current foreground instead of drawing it as-is.
        Rename it and the icon goes black on a dark panel.
      - This comment sits *inside* the <svg> element on purpose. gdk-pixbuf
        sniffs for the literal "<svg" within the first ~100 bytes of the file;
        a header comment above the root element pushes it past that window and
        the file fails to load at all, with "couldn't recognize the image file
        format" as the only clue.
  -->
  <path fill="#222222" fill-rule="evenodd" d="
    M8 1.75
    C12.05 1.75 15.25 4.95 15.25 9
    C15.25 11.95 12.95 14.25 10 14.25
    L6 14.25
    C3.05 14.25 0.75 11.95 0.75 9
    C0.75 4.95 3.95 1.75 8 1.75
    Z
    M4.15 11.75
    C5.35 7.9 8.15 5.05 12.15 4.05
    C9.35 6.05 7.55 8.65 6.7 11.75
    Z
  "/>
</svg>
