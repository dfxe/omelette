[package]
name = "voce"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Private, local-first dictation for GNOME"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
glib = "0.20"
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = "2.12"
zbus = { version = "4.4", features = ["blocking"] }

[dev-dependencies]
tempfile = "3.14"

[package.metadata.deb]
maintainer = "Voce Contributors"
section = "sound"
priority = "optional"
depends = "$auto, pw-record, gnome-shell (>= 46), gir1.2-gtk-4.0, gir1.2-adw-1"
assets = [
  ["target/release/voce", "usr/bin/voce", "755"],
  ["target/release/whisper-cli", "usr/libexec/voce/whisper-cli", "755"],
  ["data/org.voce.Voce.desktop", "usr/share/applications/org.voce.Voce.desktop", "644"],
  ["data/org.voce.Voce.metainfo.xml", "usr/share/metainfo/org.voce.Voce.metainfo.xml", "644"],
  ["data/org.voce.Voce.gschema.xml", "usr/share/glib-2.0/schemas/org.voce.Voce.gschema.xml", "644"],
  ["data/voce.service", "usr/lib/systemd/user/voce.service", "644"],
  ["README.md", "usr/share/doc/voce/README.md", "644"],
]
